workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - test

ci-check:
  stage: test
  image: golang:1.25-bookworm
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends build-essential file git binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi libc6-dev-armel-cross libcap2-bin passwd util-linux
    - |
      printf '%s\n' 'GitLab container execution context:'
      id
      uname -a
      grep -E '^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs):' /proc/self/status
      capsh --print
    - useradd --create-home --shell /bin/sh lmux-ci
    - chown -R lmux-ci:lmux-ci "$CI_PROJECT_DIR"
  script:
    # TIOCEXCL intentionally permits CAP_SYS_ADMIN to bypass exclusivity.
    - |
      setpriv --reuid=lmux-ci --regid=lmux-ci --init-groups \
        --inh-caps=-all --ambient-caps=-all --no-new-privs \
        env HOME=/home/lmux-ci sh -ec '
          printf "%s\n" "GitLab test execution context:"
          id
          uname -a
          grep -E "^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs):" /proc/self/status
          capsh --print
          cap_eff=$(sed -n "s/^CapEff:[[:space:]]*//p" /proc/self/status)
          test "$cap_eff" = 0000000000000000
          exec sh scripts/ci-check.sh
        '
  artifacts:
    expire_in: 7 days
    paths:
      - build/host/lmux
      - build/host/lmuxd
      - build/host/lmux-uart-dispatch
      - build/host/lmux-mcp
      - build/target/lmux
      - build/target/lmuxd
      - build/target/lmux-uart-dispatch
